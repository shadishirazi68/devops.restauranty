
name: Restauranty CI/CD

on:
  push:
    branches:
      - final-project
      - main
  pull_request:
    branches:
      - final-project
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Test Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth, discounts, items]

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build if supported
        run: npm run build --if-present

      - name: Check Node.js syntax
        run: node --check server.js

      - name: Run available tests
        run: npm test --if-present

  frontend-ci:
    name: Test and Build React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run React tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"

      - name: Build React application
        run: npm run build
        env:
          CI: "false"

  docker-build-push:
    name: Docker - ${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    needs: [backend-ci, frontend-ci]

    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: ./backend/auth
          - service: discounts
            context: ./backend/discounts
          - service: items
            context: ./backend/items
          - service: frontend
            context: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-to-eks:
    name: Deploy Restauranty to AWS EKS
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/final-project'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::686699774218:role/restauranty-shadi-github-deploy
          aws-region: us-east-1
          role-session-name: restauranty-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --name restauranty-eks \
            --region us-east-1

      - name: Verify Kubernetes permissions
        run: |
          kubectl auth can-i patch deployments \
            --namespace restauranty

      - name: Deploy new Docker images
        run: |
          kubectl -n restauranty set image \
            deployment/restauranty-auth \
            auth=shadshad/restauranty-auth:${GITHUB_SHA}

          kubectl -n restauranty set image \
            deployment/restauranty-discounts \
            discounts=shadshad/restauranty-discounts:${GITHUB_SHA}

          kubectl -n restauranty set image \
            deployment/restauranty-items \
            items=shadshad/restauranty-items:${GITHUB_SHA}

          kubectl -n restauranty set image \
            deployment/restauranty-frontend \
            frontend=shadshad/restauranty-frontend:${GITHUB_SHA}

      - name: Verify deployment rollouts
        run: |
          for service in auth discounts items frontend; do
            kubectl -n restauranty rollout status \
              deployment/restauranty-$service \
              --timeout=300s
          done

      - name: Show deployment results
        run: |
          kubectl -n restauranty get deployments
          kubectl -n restauranty get pods
