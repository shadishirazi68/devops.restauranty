
apiVersion: apps/v1
kind: Deployment

metadata:
  name: restauranty-auth
  namespace: restauranty
  labels:
    app: restauranty-auth

spec:
  replicas: 1

  selector:
    matchLabels:
      app: restauranty-auth

  template:
    metadata:
      labels:
        app: restauranty-auth

    spec:
      containers:
        - name: auth
          image: shadshad/restauranty-auth:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: restauranty-backend-secrets
                  key: MONGODB_URI

            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: restauranty-backend-secrets
                  key: SECRET

          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
