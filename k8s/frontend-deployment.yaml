
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restauranty-frontend
  namespace: restauranty
  labels:
    app: restauranty-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: restauranty-frontend

  template:
    metadata:
      labels:
        app: restauranty-frontend

    spec:
      containers:
        - name: frontend
          image: shadshad/restauranty-frontend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
