
apiVersion: v1
kind: Service
metadata:
  name: restauranty-mongodb
  namespace: restauranty
  labels:
    app: restauranty-mongodb
spec:
  clusterIP: None
  selector:
    app: restauranty-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restauranty-mongodb
  namespace: restauranty
spec:
  serviceName: restauranty-mongodb
  replicas: 1

  selector:
    matchLabels:
      app: restauranty-mongodb

  template:
    metadata:
      labels:
        app: restauranty-mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017
              name: mongodb

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: restauranty-mongodb-auth
                  key: mongo-root-username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restauranty-mongodb-auth
                  key: mongo-root-password

            - name: MONGO_INITDB_DATABASE
              value: Restauranty

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: restauranty-gp3

        resources:
          requests:
            storage: 10Gi
