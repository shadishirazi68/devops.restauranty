
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: restauranty
spec:
  podSelector:
    matchLabels:
      app: restauranty-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restauranty-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-ingress
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: restauranty
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - restauranty-auth
          - restauranty-discounts
          - restauranty-items
  policyTypes:
    - Ingress
  ingress:
    # NGINX Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restauranty-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-ingress
      ports:
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
        - port: 3003
          protocol: TCP

    # Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
        - port: 3003
          protocol: TCP

    # Communication between backend services
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - restauranty-auth
                  - restauranty-discounts
                  - restauranty-items
      ports:
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
        - port: 3003
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-ingress
  namespace: restauranty
spec:
  podSelector:
    matchLabels:
      app: restauranty-mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - restauranty-auth
                  - restauranty-discounts
                  - restauranty-items
      ports:
        - protocol: TCP
          port: 27017

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: restauranty
spec:
  podSelector: {}
  policyTypes:
    - Ingress
