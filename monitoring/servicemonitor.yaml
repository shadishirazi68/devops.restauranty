apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: restauranty-backends
  namespace: restauranty
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - restauranty-auth
          - restauranty-discounts
          - restauranty-items
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
